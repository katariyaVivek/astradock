[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astradock-analysis"
version = "0.1.0"
description = "Analysis and visualization tooling for the AstraDock simulator"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = []
py-modules = []

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.9,<4.0",
]
ml = [
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.0,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build*", "cmake-build*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

